[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diploma-ai-assistant"
version = "3.4.0"
requires-python = ">=3.12"

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-supervisor==0.0.31",
    "langgraph-checkpoint-sqlite>=2.1",
    "langgraph-checkpoint-postgres>=2.1",
    "aiosqlite",
    "psycopg[binary,pool]>=3.2",
]
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
    "anthropic>=0.40",
    "pandas>=2",
    "arize-phoenix>=5",
    "instructor>=1.15,<2",
    "rapidfuzz>=3",
]
tracing = [
    "openinference-instrumentation-llama-index>=4.4,<5",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "arize-phoenix-client>=2",
]

[tool.setuptools.packages.find]
include = ["app*", "bot*"]
