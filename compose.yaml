services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      CHAT_REPOSITORY: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diploma
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      NO_PROXY: localhost,127.0.0.1,redis,app,phoenix,postgres
      no_proxy: localhost,127.0.0.1,redis,app,phoenix,postgres
    volumes:
      - embedding-cache:/app/.cache/embeddings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    command: ["python", "-m", "bot"]
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      NO_PROXY: localhost,127.0.0.1,app
      no_proxy: localhost,127.0.0.1,app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diploma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  embedding-cache: {}
  pg-data: {}
  redis_data: {}
  phoenix-data: {}
