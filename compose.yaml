services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      CHAT_REPOSITORY: postgres
      AGENT_CHECKPOINTER: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diploma
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      RAG_TRACING_ENABLED: ${RAG_TRACING_ENABLED:-true}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-openai/gpt-5.4-mini}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: documents
      EMBEDDING_DIM: 768
      RAG_DATA_DIR: /app/data
      RAG_COLLECTION: rag_block_03
      RAG_PRODUCTION_COLLECTION: ${RAG_PRODUCTION_COLLECTION:-corporate_rag}
      RAG_DOCSTORE_PATH: /app/.cache/rag/docstore.json
      RAG_BAREMETAL_COLLECTION: rag_block_03_baremetal
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 64
      RAG_SIMILARITY_TOP_K: 3
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.82}
      RAG_CHUNKING_STRATEGY: ${RAG_CHUNKING_STRATEGY:-recursive}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-5}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RERANK_TOP_N: ${RAG_RERANK_TOP_N:-5}
      RAG_CONDENSE_ENABLED: ${RAG_CONDENSE_ENABLED:-true}
      RAG_MAX_SOURCES: ${RAG_MAX_SOURCES:-5}
      NO_PROXY: localhost,127.0.0.1,redis,app,phoenix,postgres,qdrant
      no_proxy: localhost,127.0.0.1,redis,app,phoenix,postgres,qdrant
    volumes:
      - ./.cache/embeddings:/app/.cache/embeddings
      - rag-state:/app/.cache/rag
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: tracing
    image: llm-service:v1
    command: ["python", "scripts/ingest.py", "/app/data", "--mode", "incremental"]
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      RAG_DATA_DIR: /app/data
      RAG_PRODUCTION_COLLECTION: ${RAG_PRODUCTION_COLLECTION:-corporate_rag}
      RAG_DOCSTORE_PATH: /app/.cache/rag/docstore.json
      RAG_CHUNKING_STRATEGY: recursive
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 64
    volumes:
      - ./.cache/embeddings:/app/.cache/embeddings
      - rag-state:/app/.cache/rag
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    command: ["python", "-m", "bot"]
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      NO_PROXY: localhost,127.0.0.1,app
      no_proxy: localhost,127.0.0.1,app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diploma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': > /dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  rag-state: {}
  pg-data: {}
  qdrant-storage: {}
  redis_data: {}
  phoenix-data: {}
