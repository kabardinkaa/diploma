x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: diploma-ai-assistant:3.4.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      CHAT_REPOSITORY: postgres
      AGENT_CHECKPOINTER: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/diploma
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-5.4-mini}
      AGENT_MODEL: ${AGENT_MODEL:-openai/gpt-5.4-mini}
      RAG_TRACING_ENABLED: ${RAG_TRACING_ENABLED:-true}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-openai/gpt-5.4-mini}
      RAG_MAX_TOKENS: ${RAG_MAX_TOKENS:-256}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-256}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
      LLM_CACHE_MAX_ENTRIES: ${LLM_CACHE_MAX_ENTRIES:-256}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
      PUBLIC_RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-true}
      PUBLIC_RATE_LIMIT_REQUESTS: ${PUBLIC_RATE_LIMIT_REQUESTS:-30}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      PUBLIC_MAX_CONCURRENT_REQUESTS: ${PUBLIC_MAX_CONCURRENT_REQUESTS:-4}
      DOCUMENT_UPLOAD_MAX_BYTES: ${DOCUMENT_UPLOAD_MAX_BYTES:-10485760}
      CHAT_MEDIA_MAX_BYTES: ${CHAT_MEDIA_MAX_BYTES:-10485760}
      DOCUMENT_ARCHIVE_MAX_ENTRIES: ${DOCUMENT_ARCHIVE_MAX_ENTRIES:-1000}
      DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-52428800}
      DOCUMENT_ARCHIVE_MAX_COMPRESSION_RATIO: ${DOCUMENT_ARCHIVE_MAX_COMPRESSION_RATIO:-100}
      REINDEX_MAX_FILES: ${REINDEX_MAX_FILES:-500}
      REINDEX_MAX_TOTAL_BYTES: ${REINDEX_MAX_TOTAL_BYTES:-268435456}
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      EMBEDDING_BATCH_SIZE: 32
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_DIM: 768
      RAG_DATA_DIR: /app/data
      RAG_PRODUCTION_COLLECTION: ${RAG_PRODUCTION_COLLECTION:-corporate_rag}
      RAG_DOCSTORE_PATH: /app/.cache/rag/docstore.json
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 64
      RAG_SIMILARITY_TOP_K: 3
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.82}
      RAG_CHUNKING_STRATEGY: ${RAG_CHUNKING_STRATEGY:-recursive}
      RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-5}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RERANK_TOP_N: ${RAG_RERANK_TOP_N:-5}
      RAG_CONDENSE_ENABLED: ${RAG_CONDENSE_ENABLED:-true}
      RAG_MAX_SOURCES: ${RAG_MAX_SOURCES:-5}
      NO_PROXY: localhost,127.0.0.1,app,phoenix,postgres,qdrant
      no_proxy: localhost,127.0.0.1,app,phoenix,postgres,qdrant
    volumes:
      - ./.cache/embeddings:/app/.cache/embeddings
      - rag-state:/app/.cache/rag
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); opener.open('http://127.0.0.1:8000/health/live')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-3g}
    cpus: ${APP_CPU_LIMIT:-2.0}
    pids_limit: 512
    logging: *default-logging

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: tracing
    image: diploma-ai-assistant:3.4.0
    command: ["python", "scripts/ingest.py", "/app/data", "--mode", "incremental"]
    env_file:
      - .env
    environment:
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      RAG_DATA_DIR: /app/data
      RAG_PRODUCTION_COLLECTION: ${RAG_PRODUCTION_COLLECTION:-corporate_rag}
      RAG_DOCSTORE_PATH: /app/.cache/rag/docstore.json
      RAG_CHUNKING_STRATEGY: recursive
      RAG_CHUNK_SIZE: 512
      RAG_CHUNK_OVERLAP: 64
      NO_PROXY: localhost,127.0.0.1,app,phoenix,postgres,qdrant
      no_proxy: localhost,127.0.0.1,app,phoenix,postgres,qdrant
    volumes:
      - ./.cache/embeddings:/app/.cache/embeddings
      - rag-state:/app/.cache/rag
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    mem_limit: ${INGEST_MEMORY_LIMIT:-4g}
    cpus: ${INGEST_CPU_LIMIT:-2.0}
    pids_limit: 512
    logging: *default-logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: diploma-ai-assistant:3.4.0
    command: ["python", "-m", "bot"]
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
      BOT_RATE_LIMIT_REQUESTS: ${BOT_RATE_LIMIT_REQUESTS:-10}
      BOT_RATE_LIMIT_WINDOW_SECONDS: ${BOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      BOT_DAILY_QUOTA: ${BOT_DAILY_QUOTA:-100}
      BOT_PHOTO_MAX_BYTES: ${BOT_PHOTO_MAX_BYTES:-2097152}
      BOT_MEDIA_MAX_BYTES: ${BOT_MEDIA_MAX_BYTES:-10485760}
      NO_PROXY: localhost,127.0.0.1,app
      no_proxy: localhost,127.0.0.1,app
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: on-failure
    mem_limit: ${BOT_MEMORY_LIMIT:-512m}
    cpus: ${BOT_CPU_LIMIT:-0.5}
    pids_limit: 256
    logging: *default-logging

  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diploma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: 256
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': > /dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: ${QDRANT_MEMORY_LIMIT:-2g}
    cpus: ${QDRANT_CPU_LIMIT:-1.5}
    pids_limit: 256
    logging: *default-logging

  phoenix:
    image: arizephoenix/phoenix:version-17.8.1
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped
    mem_limit: ${PHOENIX_MEMORY_LIMIT:-2g}
    cpus: ${PHOENIX_CPU_LIMIT:-1.0}
    pids_limit: 512
    logging: *default-logging

volumes:
  rag-state: {}
  pg-data: {}
  qdrant-storage: {}
  phoenix-data: {}
